kind = "web"
previewPath = "/"
title = "OM Computer Education"
version = "1.0.0"
id = "artifacts/om-computer-education"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21011

[services.development]
run = "pnpm --filter @workspace/om-computer-education run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/om-computer-education", "run", "build" ]
publicDir = "artifacts/om-computer-education/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21011"
BASE_PATH = "/"
